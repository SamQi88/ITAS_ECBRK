_schema-version: '3.3.0'
ID: itas-ecbrk
version: 1.0.0
description: Estrazione rendiconti PDF con GPT-5.5 su SAP AI Core

modules:
  - name: itas-ecbrk-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      command: npm start
      memory: 1024M
      disk-quota: 1024M
      instances: 1
    properties:
      # --- Scelta del modello: openai | google | anthropic (un deployment per famiglia) ---
      LLM_PROVIDER: google
      DEPLOYMENT_ID_OPENAI: d5c6e9cb46489b9c
      DEPLOYMENT_ID_GOOGLE: d3e2bd1087b50450
      GOOGLE_MODEL: gemini-3.8-flash
      DEPLOYMENT_ID_ANTHROPIC: d0758f19233c0b41
      RESOURCE_GROUP: default
      AICORE_DESTINATION_NAME: SAP_AI_CORE_CROSS_SUB
      # --- Parametri di autenticazione SAP AI Core ---
      AI_API_URL: "https://api.ai.prod.eu-central-1.aws.ml.hana.ondemand.com"
      AI_CORE_BASE_URL: "https://api.ai.prod.eu-central-1.aws.ml.hana.ondemand.com"
      AI_CORE_AUTH_URL: "https://lab-ai-btp-demqquqm.authentication.eu10.hana.ondemand.com/oauth/token"
      AI_CORE_CLIENT_ID: "sb-2d4a325b-9f56-4499-973c-79c45ab5e9d2!b534359|aicore!b540"
      AI_CORE_CLIENT_SECRET: "a461ab30-e4b7-4716-8d58-d12018135bb6$6FkxR9a0U6f4Qny2KPLoKuUEZWA-SHJYNFFudpaIfNk="
      AI_API_VERSION: "2024-12-01-preview"
    requires:
      - name: itas-ecbrk-dest
    build-parameters:
      builder: npm-ci
      ignore:
        - node_modules/
        - test/
        - docs/
        - mta_archives/
        - .env
        - db.sqlite*
        - gen/

resources:
  - name: itas-ecbrk-dest
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: ai-core-destination